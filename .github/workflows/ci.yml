name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate packaging scripts
        run: |
          bash -n scripts/package-app.sh
          bash -n scripts/verify-release.sh

      - name: Run tests
        run: mvn --batch-mode clean test
